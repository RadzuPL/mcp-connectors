name: build-metrics-connector
on:
  workflow_dispatch:
  push:
    paths: ['metrics/Dockerfile.gateway', 'metrics/run-proxy.sh', '.github/workflows/build-metrics.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./metrics
          file: ./metrics/Dockerfile.gateway
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}/metrics:latest
            ${{ steps.image.outputs.repo }}/metrics:${{ github.sha }}
