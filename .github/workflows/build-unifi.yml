name: build-unifi-connector
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'unifi/UPSTREAM_REF'
      - 'unifi/Dockerfile.gateway'
      - 'gateway/**'
      - '.github/workflows/build-unifi.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The build stops here if the shared front end stops enforcing the token.
      - name: Test the authenticating proxy
        run: node gateway/test-proxy.js

      - name: Test that supergateway's port is pinned to loopback
        run: node gateway/test-loopback.js

      - name: Test the shared-session mode
        run: node gateway/test-shared-session.js

      - name: Test the entrypoint
        run: bash gateway/test-entrypoint.sh

      - id: pin
        run: |
          echo "ver=$(cat unifi/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)-$(cat unifi/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: unifi/Dockerfile.gateway
          push: true
          build-args: |
            UNIFI_MCP_VERSION=${{ steps.pin.outputs.ver }}
          tags: |
            ${{ steps.image.outputs.repo }}/unifi:latest
            ${{ steps.image.outputs.repo }}/unifi:${{ steps.pin.outputs.tag }}
