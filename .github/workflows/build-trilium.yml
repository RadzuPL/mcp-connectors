name: build-trilium

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'trilium/**'
      - 'gateway/**'
      - '.github/workflows/build-trilium.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          node trilium/test-server.js
          node gateway/test-proxy.js
          node gateway/test-loopback.js
          node gateway/test-shared-session.js
          bash gateway/test-entrypoint.sh

      - name: Lowercase repository path
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: trilium/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/trilium:latest
            ghcr.io/${{ env.REPO_LC }}/trilium:${{ github.sha }}
