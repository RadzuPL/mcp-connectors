name: build-docker-connector
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['docker/UPSTREAM_REF', 'docker/Dockerfile.gateway', '.github/workflows/build-docker.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: |
          echo "ref=$(cat docker/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)-$(cut -c1-7 docker/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buduje wprost z repo ckreilinga, na przypiętym commicie - bez ręcznego
      # kopiowania jego Dockerfile'a, więc nie ma ryzyka rozjazdu kopii.
      - name: Build pinned upstream
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/ckreiling/mcp-server-docker.git#${{ steps.pin.outputs.ref }}
          tags: local/mcp-server-docker:pinned
          push: false
          load: true

      - name: Build i publikuj gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/radzupl/mcp-connectors/docker:latest
            ghcr.io/radzupl/mcp-connectors/docker:${{ steps.pin.outputs.tag }}
