name: build-docker-connector
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['docker/UPSTREAM_REF', 'docker/Dockerfile.gateway', '.github/workflows/build-docker.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: |
          echo "ref=$(cat docker/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)-$(cut -c1-7 docker/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds straight from the upstream repo at the pinned commit instead of
      # vendoring a copy of its Dockerfile, so there's no risk of the copy
      # drifting from the original.
      - name: Build pinned upstream
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/ckreiling/mcp-server-docker.git#${{ steps.pin.outputs.ref }}
          tags: local/mcp-server-docker:pinned
          push: false
          load: true

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}/docker:latest
            ${{ steps.image.outputs.repo }}/docker:${{ steps.pin.outputs.tag }}
