name: build-files-connector
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'files/UPSTREAM_REF'
      - 'files/Dockerfile.gateway'
      - 'files/*.js'
      - 'gateway/**'
      - '.github/workflows/build-files.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The build stops here if the shared front end stops enforcing the token.
      - name: Test the authenticating proxy
        run: node gateway/test-proxy.js

      - name: Test that supergateway's port is pinned to loopback
        run: node gateway/test-loopback.js

      - name: Test the entrypoint
        run: bash gateway/test-entrypoint.sh

      # The build also stops if the access policy (DENY_NAMES / ALLOW_ONLY / READ_ONLY) breaks.
      - name: Test the access policy logic
        run: node files/test-deny-policy.js

      - name: Test the policy proxy against a fake file server
        run: node files/test-deny-proxy.js

      - id: pin
        run: |
          echo "ver=$(cat files/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)-$(cat files/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: files/Dockerfile.gateway
          push: true
          build-args: |
            MCP_FS_VERSION=${{ steps.pin.outputs.ver }}
          tags: |
            ${{ steps.image.outputs.repo }}/files:latest
            ${{ steps.image.outputs.repo }}/files:${{ steps.pin.outputs.tag }}
