name: build-files-connector
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['files/UPSTREAM_REF', 'files/Dockerfile.gateway', '.github/workflows/build-files.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: |
          echo "ver=$(cat files/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y-%m-%d)-$(cat files/UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: files/Dockerfile.gateway
          push: true
          build-args: |
            MCP_FS_VERSION=${{ steps.pin.outputs.ver }}
          tags: |
            ${{ steps.image.outputs.repo }}/files:latest
            ${{ steps.image.outputs.repo }}/files:${{ steps.pin.outputs.tag }}
