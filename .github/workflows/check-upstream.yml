name: check-upstream
on:
  schedule:
    - cron: '0 6 * * 1'   # co poniedziałek 06:00 UTC
  workflow_dispatch:

jobs:
  check-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź najnowszy commit ckreiling/mcp-server-docker
        id: latest
        run: |
          LATEST=$(git ls-remote https://github.com/ckreiling/mcp-server-docker.git HEAD | cut -f1)
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Podmień UPSTREAM_REF jeśli inny
        run: |
          if [ "$(cat docker/UPSTREAM_REF)" != "${{ steps.latest.outputs.sha }}" ]; then
            echo "${{ steps.latest.outputs.sha }}" > docker/UPSTREAM_REF
          fi

      - name: Otwórz PR (tylko jeśli jest zmiana)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docker: bump upstream ref to ${{ steps.latest.outputs.sha }}"
          title: "docker connector: nowy commit upstream (${{ steps.latest.outputs.sha }})"
          body: |
            ckreiling/mcp-server-docker ma nowy commit na main.
            Przejrzyj diff przed mergem: https://github.com/ckreiling/mcp-server-docker/commits/main

            Merge tego PR-a odpala build-docker.yml i publikuje nowy obraz.
          branch: bump/docker-upstream
          add-paths: docker/UPSTREAM_REF

  check-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź najnowszą wersję npm
        id: latest
        run: |
          LATEST=$(npm view @modelcontextprotocol/server-filesystem version)
          echo "ver=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Podmień UPSTREAM_REF jeśli inny
        run: |
          if [ "$(cat files/UPSTREAM_REF)" != "${{ steps.latest.outputs.ver }}" ]; then
            echo "${{ steps.latest.outputs.ver }}" > files/UPSTREAM_REF
          fi

      - name: Otwórz PR (tylko jeśli jest zmiana)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "files: bump server-filesystem to ${{ steps.latest.outputs.ver }}"
          title: "files connector: nowa wersja npm (${{ steps.latest.outputs.ver }})"
          body: |
            @modelcontextprotocol/server-filesystem ma nową wersję na npm.
            Changelog: https://github.com/modelcontextprotocol/servers/commits/main

            Merge tego PR-a odpala build-files.yml i publikuje nowy obraz.
          branch: bump/files-upstream
          add-paths: files/UPSTREAM_REF

  check-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź najnowszą wersję na PyPI
        id: latest
        run: |
          LATEST=$(curl -s https://pypi.org/pypi/mcp-proxy/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "ver=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Podmień UPSTREAM_REF jeśli inny
        run: |
          if [ "$(cat metrics/UPSTREAM_REF)" != "${{ steps.latest.outputs.ver }}" ]; then
            echo "${{ steps.latest.outputs.ver }}" > metrics/UPSTREAM_REF
          fi

      - name: Otwórz PR (tylko jeśli jest zmiana)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "metrics: bump mcp-proxy to ${{ steps.latest.outputs.ver }}"
          title: "metrics connector: nowa wersja PyPI (${{ steps.latest.outputs.ver }})"
          body: |
            mcp-proxy (sparfenyuk) ma nową wersję na PyPI.
            Changelog: https://github.com/sparfenyuk/mcp-proxy/releases

            Merge tego PR-a odpala build-metrics.yml i publikuje nowy obraz.
          branch: bump/metrics-upstream
          add-paths: metrics/UPSTREAM_REF
