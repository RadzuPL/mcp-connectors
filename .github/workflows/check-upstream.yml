name: check-upstream
on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  check-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest ckreiling/mcp-server-docker commit
        id: latest
        run: |
          LATEST=$(git ls-remote https://github.com/ckreiling/mcp-server-docker.git HEAD | cut -f1)
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update UPSTREAM_REF if it changed
        run: |
          if [ "$(cat docker/UPSTREAM_REF)" != "${{ steps.latest.outputs.sha }}" ]; then
            echo "${{ steps.latest.outputs.sha }}" > docker/UPSTREAM_REF
          fi

      - name: Open a PR (only if something changed)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docker: bump upstream ref to ${{ steps.latest.outputs.sha }}"
          title: "docker connector: new upstream commit (${{ steps.latest.outputs.sha }})"
          body: |
            ckreiling/mcp-server-docker has a new commit on main.
            Review the diff before merging: https://github.com/ckreiling/mcp-server-docker/commits/main

            Merging this PR triggers build-docker.yml and publishes a new image.
          branch: bump/docker-upstream
          add-paths: docker/UPSTREAM_REF

  check-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest npm version
        id: latest
        run: |
          LATEST=$(npm view @modelcontextprotocol/server-filesystem version)
          echo "ver=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update UPSTREAM_REF if it changed
        run: |
          if [ "$(cat files/UPSTREAM_REF)" != "${{ steps.latest.outputs.ver }}" ]; then
            echo "${{ steps.latest.outputs.ver }}" > files/UPSTREAM_REF
          fi

      - name: Open a PR (only if something changed)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "files: bump server-filesystem to ${{ steps.latest.outputs.ver }}"
          title: "files connector: new npm version (${{ steps.latest.outputs.ver }})"
          body: |
            @modelcontextprotocol/server-filesystem has a new version on npm.
            Changelog: https://github.com/modelcontextprotocol/servers/commits/main

            Merging this PR triggers build-files.yml and publishes a new image.
          branch: bump/files-upstream
          add-paths: files/UPSTREAM_REF

  check-unifi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check latest unifi-network-mcp version on PyPI
        id: latest
        run: |
          LATEST=$(curl -fsS https://pypi.org/pypi/unifi-network-mcp/json | jq -r .info.version)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not read the latest version from PyPI" >&2
            exit 1
          fi
          echo "ver=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Update UPSTREAM_REF if it changed
        run: |
          if [ "$(cat unifi/UPSTREAM_REF)" != "${{ steps.latest.outputs.ver }}" ]; then
            echo "${{ steps.latest.outputs.ver }}" > unifi/UPSTREAM_REF
          fi

      - name: Open a PR (only if something changed)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "unifi: bump unifi-network-mcp to ${{ steps.latest.outputs.ver }}"
          title: "unifi connector: new PyPI version (${{ steps.latest.outputs.ver }})"
          body: |
            unifi-network-mcp has a new version on PyPI. New releases appear several times a week.
            Release history: https://pypi.org/project/unifi-network-mcp/#history
            Changes: https://github.com/sirkirby/unifi-mcp/commits/main

            Merging this PR triggers build-unifi.yml and publishes a new image.
          branch: bump/unifi-upstream
          add-paths: unifi/UPSTREAM_REF
